name: agent-guard

# Repository policy for every pull request (see .github/agent-guard/guard.sh).
#
# pull_request_target runs this workflow and its script from the BASE branch (main), so a pull request
# can't edit the policy that judges it. It never checks out or runs the pull request's code: the PR is read
# only through the API, so the elevated token can't be used by PR content. The result is posted as the
# commit status `guardrails/policy` on the PR's head commit; make that a required check whose source is
# GitHub Actions, so a status posted by another app or a person doesn't count.
#
# Known limit: a pull request that edits a workflow under .github/workflows can grant that workflow
# `statuses: write` and post its own `guardrails/policy` from GitHub Actions; the latest status wins. Such a
# PR always fails this check first (.github/ is protected), but the check alone can't be trusted on it:
# review every PR that touches .github/ by hand, whatever its checks say.
on:
  pull_request_target:
    branches: [main] # the policy only judges pull requests into main (guard.sh also fails any other base)
    types: [opened, synchronize, reopened, edited, labeled, unlabeled, ready_for_review]

permissions:
  contents: read # the base branch's policy files
  pull-requests: write # only to remove approval labels after a new push
  issues: read # PR events (who applied a label, when, through which app)
  checks: read # when GitHub recorded the push of the head commit
  statuses: write # the guardrails/policy status

# One run at a time per PR, never cancelled: a later event can't cut short the run that removes a stale approval.
concurrency:
  group: agent-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  guardrails:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the base branch only (never the pull request)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          sparse-checkout: .github/agent-guard
      - name: Policy
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_ACTION: ${{ github.event.action }}
          AGENT_FREEZE_AT: ${{ vars.AGENT_FREEZE_AT }}
        run: bash .github/agent-guard/guard.sh
