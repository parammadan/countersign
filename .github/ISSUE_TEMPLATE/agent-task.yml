name: Agent task
description: One task for one cloud agent, with the files it owns. See docs/agents/TASKS.md.
title: "[T?] "
labels: ["agent:ready"]
body:
  - type: input
    id: lane
    attributes:
      label: Lane
      description: docs | detector-fixtures | ui:<route> (at most one open task per lane)
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What done looks like, in plain words.
    validations:
      required: true
  - type: textarea
    id: owns
    attributes:
      label: Owns (the only paths this task may change)
      description: One path or glob per line. Must not overlap any other open agent task.
    validations:
      required: true
  - type: textarea
    id: reads
    attributes:
      label: May read but must not change
    validations:
      required: false
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance checks
      description: The tests and observable results the PR must show.
    validations:
      required: true
  - type: textarea
    id: out
    attributes:
      label: Out of scope
    validations:
      required: true
